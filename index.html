<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Iron Gym</title>
    <link rel="stylesheet" href="style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background-color: #111;
            color: white;
        }

        header {
            background: linear-gradient(to right, #000, #1a1a1a);
            padding: 20px;
            text-align: center;
        }

        header h1 {
            color: #e10600;
            font-size: 40px;
        }

        nav {
            margin-top: 10px;
        }

        nav a {
            color: white;
            margin: 0 15px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        nav a:hover {
            color: #e10600;
        }

        .banner {
            height: 80vh;
            background-image: url("https://images.unsplash.com/photo-1558611848-73f7eb4001a1");
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .banner h2 {
            font-size: 50px;
            background: rgba(0,0,0,0.7);
            padding: 20px;
            border-radius: 10px;
        }

        .section {
            padding: 50px;
            text-align: center;
        }

        .cards {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
        }

        .card {
            background-color: #1a1a1a;
            width: 280px;
            border-radius: 10px;
            overflow: hidden;
            transition: transform 0.3s;
            cursor: pointer;
        }

        .card:hover {
            transform: scale(1.05);
        }

        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .card h3 {
            padding: 15px;
            color: #e10600;
        }

        .card p {
            padding: 0 15px 20px;
            font-size: 14px;
        }

        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 15px 30px;
            background-color: #e10600;
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn:hover {
            background-color: #b00000;
        }

        footer {
            background-color: #000;
            padding: 20px;
            text-align: center;
            margin-top: 50px;
            font-size: 14px;
        }
    </style>
</head>
<body>

<header>
    <h1>IRON GYM</h1>
    <nav>
        <a href="planos.html">Planos</a>
        <a href="treinos.html">Treinos</a>
        <a href="contatos.html">Contato</a>
    </nav>
</header>

<section class="banner">
    <h2>FORÇA • FOCO • RESULTADO</h2>
</section>

<section class="section" id="treinos">
    <h2>🔥 Nossos Treinos</h2>
    <br>
    <div class="cards">
        <a href="musculacao.html" class="card-link">
            <div class="card">
              <img src="https://maquinadoesporte.com.br/wp-content/uploads/2024/01/Design-sem-nome-1.png.webp" alt="Treino de Musculação">
              <h3>Musculação</h3>
              <p>Força, hipertrofia e definição muscular.</p>
            </div>
          </a>

        <a href="funcional.html" class="card-link">
            <div class="card">
              <img src="https://images.unsplash.com/photo-1517836357463-d25dfeac3438" alt="Treino Funcional">
              <h3>Funcional</h3>
              <p>Movimentos naturais para força e resistência.</p>
            </div>
          </a>

        <a href="cardio.html" class="card-link">
            <div class="card">
              <img src="https://blog.prosportrs.com.br/wp-content/uploads/2024/08/Turbinando-sua-resist%C3%AAncia-o-trio-din%C3%A2mico-de-cardio-na-academia-900x480.jpg" alt="Treino de Cardio">
              <h3>Cardio</h3>
              <p>Queime gordura e melhore seu fôlego.</p>
            </div>
          </a>

    </div>

    <a href="#" class="btn">COMEÇAR AGORA</a>
</section>

<footer id="contato">
    <p>📍 Iron Gym - Caua fodao</p>
    <p>📞 (11) 956583386</p>
</footer>

</body>
</html>
